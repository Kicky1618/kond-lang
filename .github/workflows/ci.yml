name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86
            runner: windows-2025
            cmake_arch: Win32
            artifact: kond-windows-x86
            test: false
            llvm: false
          - name: Windows Arm64
            runner: windows-2025
            cmake_arch: ARM64
            artifact: kond-windows-arm64
            test: false
            llvm: false
          - name: macOS Arm64
            runner: macos-14
            cmake_arch: ""
            artifact: kond-macos-arm64
            test: false
            llvm: false
          - name: Linux x86_64
            runner: ubuntu-24.04
            cmake_arch: ""
            artifact: kond-linux-x86_64
            test: true
            llvm: true
          - name: Linux Arm64
            runner: ubuntu-24.04-arm
            cmake_arch: ""
            artifact: kond-linux-arm64
            test: true
            llvm: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install LLVM
        if: matrix.llvm
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y llvm

      - name: Configure
        shell: bash
        run: |
          if [ -n "${{ matrix.cmake_arch }}" ]; then
            cmake -S . -B build -A "${{ matrix.cmake_arch }}" -DCMAKE_BUILD_TYPE=Release -DKOND_ENABLE_LLVM_JIT=${{ matrix.llvm && 'ON' || 'OFF' }}
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKOND_ENABLE_LLVM_JIT=${{ matrix.llvm && 'ON' || 'OFF' }}
          fi

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test
        if: matrix.test
        shell: bash
        run: ./tests/run.sh ./build/kond

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.os == 'Windows' && 'build/Release/kond.exe' || 'build/kond' }}

  cross-build:
    name: Linux ${{ matrix.name }} cross-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: RISC-V 64
            triple: riscv64-linux-gnu
            artifact: kond-linux-riscv64
          - name: PowerPC 64 LE
            triple: powerpc64le-linux-gnu
            artifact: kond-linux-ppc64le
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake \
            ninja-build \
            g++-${{ matrix.triple }}

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_SYSTEM_NAME=Linux
          -DCMAKE_C_COMPILER=${{ matrix.triple }}-gcc
          -DCMAKE_CXX_COMPILER=${{ matrix.triple }}-g++
          -DKOND_ENABLE_LLVM_JIT=OFF

      - name: Build
        run: cmake --build build --parallel 2

      - name: Verify target architecture
        run: file build/kond

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/kond

  deploy:
    name: Deploy to GitHub Pages
    needs: [native-build, cross-build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Upload artifact to Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
